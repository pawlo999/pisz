<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>Pisz — parent</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#14161c;color:#eceff5;font:500 15px/1.45 ui-rounded,system-ui,-apple-system,sans-serif;}
  main{max-width:680px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px;}
  h1{font-size:22px;margin:4px 0 14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  input{flex:1;min-width:200px;font:14px ui-monospace,monospace;padding:12px;border-radius:10px;border:1px solid #2b3142;background:#0b0d12;color:#cfd5e1}
  button{background:#7c5cff;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:15px}
  #msg{color:#9aa3b2;font-size:13px;min-height:18px}
  select{background:#0b0d12;color:#cfd5e1;border:1px solid #2b3142;border-radius:10px;padding:10px}
</style>
</head>
<body>
<main>
  <h1 id="title">How she is doing</h1>
  <div class="row">
    <input id="key" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"
           placeholder="sync key (the same one as in the app)">
    <select id="lang"><option value="pl">Polski</option><option value="nb">Norsk</option></select>
    <button id="go">Show</button>
  </div>
  <div id="msg"></div>
  <div id="rep"></div>
</main>
<script src="engine.js"></script>
<script src="report.js"></script>
<script>
(function(){
  'use strict';
  var SYNC_URL = 'https://pisz-sync.pawlo999.workers.dev';
  var K = 'pisz.parent.key', LK = 'pisz.parent.lang';
  var $ = function(id){ return document.getElementById(id); };
  try{ $('key').value = localStorage.getItem(K) || ''; $('lang').value = localStorage.getItem(LK) || 'pl'; }catch(e){}
  function load(){
    var key = ($('key').value || '').trim();
    if(!key){ $('msg').textContent = 'Paste the sync key from the app’s parent settings.'; return; }
    try{ localStorage.setItem(K, key); localStorage.setItem(LK, $('lang').value); }catch(e){}
    $('msg').textContent = 'loading…';
    fetch(SYNC_URL + '/s/' + encodeURIComponent(key))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d || !Array.isArray(d.log)) throw new Error((d && d.error) || 'bad reply');
        var s = d.settings || {};
        $('title').textContent = 'How ' + (d.name ? d.name.charAt(0) + d.name.slice(1).toLowerCase() : 'she') + ' is doing';
        window.PiszReport.render($('rep'), d.log, { lang:$('lang').value, digits:!!s.digits, now:Date.now(),
          plan:window.Pisz.session(window.Pisz.rebuild(d.log), { lang:$('lang').value, name:d.name, size:s.size || 5, digits:!!s.digits }) });
        $('msg').textContent = d.log.length + ' rows · last sync ' + (d.updated ? new Date(d.updated).toLocaleString() : '—');
      })
      .catch(function(e){ $('msg').textContent = 'Could not load: ' + (e.message || e); });
  }
  $('go').addEventListener('click', load);
  $('lang').addEventListener('change', load);
  if($('key').value) load();
})();
</script>
</body>
</html>
